<div class="card" [class.compact]="compact">
  <div class="card-img-wrap">
    <img [src]="property.image" [alt]="property.title" loading="lazy" />
    <span class="badge-type">{{ property.type }}</span>
    <span class="badge-price">{{ property.price }}€ / nuit</span>
    <button class="btn-fav" [class.active]="property.isFavorite" (click)="toggleFavorite($event)">
      <i
        class="bi"
        [class.bi-heart-fill]="property.isFavorite"
        [class.bi-heart]="!property.isFavorite"
      ></i>
    </button>
  </div>

  <div class="card-info">
    <h6 class="card-name">{{ property.title }}</h6>
    <div class="card-stars">
      @for (s of stars; track s) {
        <i
          class="bi bi-star-fill"
          [style.color]="s < property.rating ? 'var(--orange)' : '#DDD'"
          style="font-size: 11px"
        ></i>
      }
      <span class="review-n">({{ property.reviewCount }})</span>
    </div>
    <p class="card-desc">{{ property.description }}</p>
  </div>
</div>
