<div class="cf-wrapper">
  <div class="cf-scroll">
    @for (cat of categories; track cat.label) {
      <button
        type="button"
        class="chip"
        [class.chip-active]="active() === cat.label"
        (click)="selecter(cat.label)"
      >
        <i class="bi {{ cat.icon }}"></i>
        {{ cat.label }}
      </button>
    }
  </div>
</div>
