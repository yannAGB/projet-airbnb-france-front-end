<div class="search-bar">
  <div class="sb-row">
    <div class="sb-field">
      <label class="sb-label"> <i class="bi bi-geo-alt-fill"></i> Où allez-vous ? </label>
      <input class="sb-input" type="text" placeholder="Paris, Lyon, Nice..." />
    </div>

    <div class="sb-divider"></div>

    <div class="sb-field">
      <label class="sb-label"> <i class="bi bi-calendar3"></i> Arrivée </label>
      <input class="sb-input" type="date" />
    </div>

    <div class="sb-divider"></div>

    <div class="sb-field">
      <label class="sb-label"> <i class="bi bi-calendar3"></i> Départ </label>
      <input class="sb-input" type="date" />
    </div>

    <div class="sb-divider"></div>

    <div class="sb-field">
      <label class="sb-label"> <i class="bi bi-people-fill"></i> Voyageurs </label>
      <div class="counter">
        <button type="button" (click)="decrement()">−</button>
        <span>{{ voyageurs() }} voyageur{{ voyageurs() > 1 ? 's' : '' }}</span>
        <button type="button" (click)="increment()">+</button>
      </div>
    </div>

    <button class="btn-search" type="button">
      <i class="bi bi-search"></i>
      Rechercher
    </button>
  </div>
</div>
