<section class="property-grid-section">
  <div class="container-fluid px-5">
    <div class="section-header">
      <h2 class="section-title">Quel type d'hébergement cherchez-vous ?</h2>
    </div>

    <div class="row g-4">
      <!-- Grille de cartes -->
      <div class="col-lg-7">
        <div class="row g-3">
          @for (p of properties; track p.id) {
            <div class="col-sm-6 col-md-4">
              <app-property-card [property]="p" [compact]="true" />
            </div>
          }
        </div>
        <div class="text-center mt-4">
          <a href="#" class="voir-plus">Voir plus d'hébergements →</a>
        </div>
      </div>

      <!-- Carte -->
      <div class="col-lg-5">
        <div class="map-wrapper">
          <app-map />
        </div>
      </div>
    </div>
  </div>
</section>
