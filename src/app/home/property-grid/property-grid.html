<section class="pg-section" id="logements">
  <div class="container-xxl px-4 px-lg-5">
    <div class="section-head">
      <h2 class="section-title">Quel type d'hébergement cherchez-vous ?</h2>
    </div>

    <div class="row g-4">
      <!-- Grille cartes -->
      <div class="col-lg-7">
        @if (chargement()) {
          <div class="d-flex justify-content-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Chargement...</span>
            </div>
          </div>
        }

        @if (erreur() && !chargement()) {
          <div class="alert alert-warning">{{ erreur() }}</div>
        }

        @if (!chargement() && !erreur()) {
          <div class="row g-3">
            @for (p of properties; track p.id) {
              <div class="col-sm-6 col-md-4">
                <app-property-card [property]="p" [compact]="true" />
              </div>
            }
          </div>
          <div class="text-center mt-4">
            <a href="#" class="btn-voir-plus">
              Voir plus d'hébergements
              <i class="bi bi-arrow-right ms-2"></i>
            </a>
          </div>
        }
      </div>

      <!-- Carte -->
      <div class="col-lg-5">
        <div class="map-box">
          <app-map />
        </div>
      </div>
    </div>
  </div>
</section>
