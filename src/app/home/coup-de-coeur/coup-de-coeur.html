<section class="coeur-section">
  <div class="container-xxl px-4 px-lg-5">
    <div class="section-head">
      <h2 class="section-title">Logements coup de cœur</h2>
      <div class="ctrl-btns">
        <button type="button" class="ctrl" (click)="scrollLeft()">
          <i class="bi bi-chevron-left"></i>
        </button>
        <button type="button" class="ctrl" (click)="scrollRight()">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>

    @if (chargement()) {
      <div class="carousel-track">
        @for (n of [1, 2, 3, 4, 5, 6]; track n) {
          <div class="carousel-item-wrap">
            <div class="card-skeleton"></div>
          </div>
        }
      </div>
    } @else {
      <div class="carousel-track" #track>
        @for (p of properties; track p.id) {
          <div class="carousel-item-wrap">
            <app-property-card [property]="p" />
          </div>
        }
      </div>
    }
  </div>
</section>
