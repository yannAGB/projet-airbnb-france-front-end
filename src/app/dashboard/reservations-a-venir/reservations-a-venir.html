<div class="section-card">
  <h5 class="section-title">Réservations à venir</h5>
  <div class="gallery">
    @for (img of images; track img; let i = $index) {
      <div class="gallery-item" [class.gallery-main]="i === 0">
        <img [src]="img" [alt]="'Logement ' + (i + 1)" loading="lazy" />
      </div>
    }
  </div>
</div>
