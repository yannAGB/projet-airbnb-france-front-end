<!-- Vue de la FormGroup -->

<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <label for="lastName">Nom:</label>
  <input id="lastName" type="text" formControlName="lastName" />

  <label for="firstName">Prénom:</label>
  <input id="firstName" type="text" formControlName="firstName" />

  <label for="userName">Nom d'utilisateur:</label>
  <input id="userName" type="text" formControlName="userName" />

  <label for="civilite">Cilité:</label>
  <select name="civilite" id="civilite" formControlName="civilite">
    <option value="madame">Madame</option>
    <option value="autre">Autre</option>
    <option value="monsieur" selected>Monsieur</option>
    <option value="inconnu">Inconnu</option>
  </select>

  <input id="utilisateur" type="radio" name="role" value="utilisateur" />
  <label for="utilisateur">utilisateur</label>

  <input id="agence_immobiliere" type="radio" name="role" value="agence_immobiliere" />
  <label for="agence_immobiliere">Agence immobilière</label>

  <label for="email">Email:</label>
  <input id="email" type="email" formControlName="email" />

  <label for="password">Password:</label>
  <input id="password" type="password" formControlName="password" />

  <label for="birthday">Date de naissance:</label>
  <input id="birthday" type="date" formControlName="birthday" />

  <button type="submit" [disabled]="!registerForm.valid">Submit</button>
</form>
